<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A1628">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Salvadanaio: gestione personale della liquidità">
<title>Salvadanaio</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#0A1628; --surface:#101F37; --surface2:#162946; --line:#22375A; --line2:#2C4570;
  --text:#E9EEF6; --text2:#AEBBD0; --muted:#7D8DA8;
  --gold:#D4AF37; --gold2:#F0D27A; --gold-dim:rgba(212,175,55,.14);
  --good:#3DBE8B; --warn:#E6A93C; --bad:#E5646E;
  --good-dim:rgba(61,190,139,.14); --warn-dim:rgba(230,169,60,.14); --bad-dim:rgba(229,100,110,.14);
  --r:14px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:15px;line-height:1.4}
body{min-height:100vh;overscroll-behavior-y:contain}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.muted{color:var(--muted)} .t2{color:var(--text2)}
.pos{color:var(--good)} .neg{color:var(--bad)}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 70%,rgba(10,22,40,0));
  padding:calc(var(--safe-t) + 14px) 16px 10px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;flex:1}
.brand img{width:32px;height:32px;border-radius:9px;background:#fff;display:block}
.eye{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text2);display:grid;place-items:center}
.eye svg{width:22px;height:22px}
.eye.on{color:var(--gold2);border-color:rgba(212,175,55,.5);background:var(--gold-dim)}
.hidden-note{font-size:11px;color:var(--gold2);letter-spacing:.4px}
.brand b{font-family:Georgia,"Times New Roman",serif;font-weight:600;font-size:21px;letter-spacing:.3px}
.brand small{display:block;font-size:11px;color:var(--muted);letter-spacing:1.2px;text-transform:uppercase;margin-top:-2px}

main{padding:0 16px calc(110px + var(--safe-b));max-width:560px;margin:0 auto}
.view{display:none} .view.on{display:block}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:12px;font-weight:600;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;justify-content:space-between;gap:8px}
.hero{background:linear-gradient(145deg,#132A4D 0%,#0E1F3A 60%,#0C1A31 100%);border-color:var(--line2);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;
  background:radial-gradient(circle,rgba(212,175,55,.16),transparent 70%)}
.hero .label{font-size:12px;letter-spacing:1.1px;text-transform:uppercase;color:var(--text2)}
.hero .big{font-size:36px;font-weight:600;margin:4px 0 14px}
.wallets{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wallet{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;width:100%}
.wallet .wl{font-size:12px;color:var(--text2);display:flex;justify-content:space-between;align-items:center}
.wallet .wv{font-size:18px;font-weight:600;margin-top:2px}
.wallet .sync{font-size:11px;color:var(--gold);opacity:.9}

.kv{display:flex;justify-content:space-between;align-items:baseline;padding:4px 0}
.kv span:first-child{color:var(--text2)}
.bar{height:10px;background:var(--surface2);border-radius:6px;position:relative;overflow:visible;margin:10px 0 6px}
.bar i{display:block;height:100%;border-radius:6px;background:var(--gold);max-width:100%}
.bar .pace{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--text);border-radius:1px;opacity:.75}
.legend-row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px;letter-spacing:0;text-transform:none}
.badge.good{background:var(--good-dim);color:var(--good)}
.badge.warn{background:var(--warn-dim);color:var(--warn)}
.badge.bad{background:var(--bad-dim);color:var(--bad)}
.badge.neutral{background:var(--gold-dim);color:var(--gold2)}

.week-hero{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.week-hero .big2{font-size:28px;font-weight:600}
.weeks{display:grid;gap:8px;margin-top:14px}
.wk{display:grid;grid-template-columns:78px 1fr 92px;align-items:center;gap:10px;font-size:13px}
.wk .wn{color:var(--text2)} .wk .wn small{display:block;color:var(--muted);font-size:11px}
.wk .mini{height:6px;background:var(--surface2);border-radius:4px;overflow:hidden}
.wk .mini i{display:block;height:100%;border-radius:4px}
.wk .wv{text-align:right;font-size:12px}
.wk.cur .wn{color:var(--gold2);font-weight:600}
.wk.future{opacity:.5}

.note{font-size:13px;color:var(--text2);margin:10px 0 0}
.banner{display:flex;gap:10px;align-items:center;background:var(--gold-dim);border:1px solid rgba(212,175,55,.35);
  color:var(--gold2);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:13px}
.banner button{margin-left:auto;background:var(--gold);color:#1a1405;border:0;border-radius:8px;padding:6px 10px;font-weight:600;font-size:12px}

/* ---------- list ---------- */
.tx{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.tx:last-child{border-bottom:0}
.ic{width:38px;height:38px;border-radius:11px;background:var(--surface2);display:grid;place-items:center;font-size:18px;flex:none}
.tx .mid{flex:1;min-width:0}
.tx .mid b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .mid small{color:var(--muted);font-size:12px}
.tx .amt{font-weight:600;white-space:nowrap}
.day-h{font-size:12px;color:var(--muted);letter-spacing:.6px;text-transform:uppercase;margin:14px 2px 2px}
.empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:14px}

.monthnav{display:flex;align-items:center;justify-content:space-between;margin:2px 0 12px}
.monthnav b{font-size:17px;font-weight:600;text-transform:capitalize}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:18px;color:var(--text2)}
.chips{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:6px 14px;font-size:13px;color:var(--text2);white-space:nowrap}
.chip.on{background:var(--gold-dim);border-color:rgba(212,175,55,.5);color:var(--gold2)}
.tot3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.tot3 div small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
.tot3 div b{font-size:15px;font-weight:600}

/* ---------- analysis ---------- */
.catrow{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:7px 0}
.catrow .cn{font-size:14px;display:flex;justify-content:space-between;gap:8px}
.catrow .cn small{color:var(--muted)}
.catrow .cb{height:6px;background:var(--surface2);border-radius:4px;margin-top:5px;overflow:hidden}
.catrow .cb i{display:block;height:100%;background:var(--gold);border-radius:0 4px 4px 0}
.catrow .cv{font-weight:600;font-size:14px;text-align:right;min-width:78px}
svg text{font-family:inherit}
.hist-detail{font-size:13px;color:var(--text2);min-height:20px;margin-top:6px;text-align:center}

/* ---------- settings ---------- */
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.row:last-child{border-bottom:0}
.row .rl{flex:1;min-width:0} .row .rl small{display:block;color:var(--muted);font-size:12px}
.row .rv{color:var(--text2);white-space:nowrap}
.row.danger .rl{color:var(--bad)}

/* ---------- nav + fab ---------- */
nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(12,24,43,.96);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);padding:6px 8px calc(6px + var(--safe-b));display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr}
nav button{background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;padding:6px 0}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--gold2)}
.fab{justify-self:center;width:58px;height:58px;border-radius:18px;margin-top:-26px;background:linear-gradient(145deg,var(--gold2),var(--gold));
  color:#1b1506;border:0;font-size:32px;font-weight:300;box-shadow:0 6px 20px rgba(212,175,55,.35),0 0 0 5px var(--bg);display:grid;place-items:center}

/* ---------- sheet ---------- */
.overlay{position:fixed;inset:0;background:rgba(3,8,16,.62);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-top:1px solid var(--line2);
  border-radius:20px 20px 0 0;max-height:92vh;overflow-y:auto;transform:translateY(105%);transition:transform .25s ease;
  padding:10px 16px calc(18px + var(--safe-b));max-width:560px;margin:0 auto}
.sheet.on{transform:none}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line2);margin:0 auto 12px}
.shx{position:absolute;top:12px;right:12px;width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--bg);color:var(--text2);font-size:17px;display:grid;place-items:center;z-index:1}
.sheet h2{font-size:18px;margin:0 0 14px;font-weight:600;padding-right:46px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:14px}
.seg button{border:0;background:none;border-radius:9px;padding:9px 4px;color:var(--text2);font-size:14px}
.seg button.on{background:var(--surface2);color:var(--text);font-weight:600;box-shadow:inset 0 0 0 1px var(--line2)}
.seg.t-out button.on{color:var(--bad)} .seg.t-in button.on{color:var(--good)} .seg.t-tr button.on{color:var(--gold2)}
.amount{display:flex;align-items:baseline;justify-content:center;gap:6px;margin:4px 0 16px}
.amount span{font-size:26px;color:var(--muted)}
.amount input{background:none;border:0;outline:none;font-size:44px;font-weight:600;width:220px;text-align:center;
  font-variant-numeric:tabular-nums;border-bottom:2px solid var(--line2);padding:0 0 4px}
.amount input:focus{border-color:var(--gold)}
.lbl{font-size:12px;color:var(--muted);letter-spacing:.8px;text-transform:uppercase;margin:0 0 8px}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.cat{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:9px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--text2);line-height:1.15;text-align:center;min-height:66px}
.cat .e{font-size:20px}
.cat.on{border-color:var(--gold);background:var(--gold-dim);color:var(--gold2)}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--muted);letter-spacing:.8px;text-transform:uppercase;margin-bottom:6px}
.field input,.field select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;outline:none}
.field input:focus,.field select:focus{border-color:var(--gold)}
.field .hint{font-size:12px;color:var(--muted);margin-top:5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;border:0;border-radius:12px;padding:14px;font-weight:600;font-size:16px;background:linear-gradient(145deg,var(--gold2),var(--gold));color:#1b1506;margin-top:6px}
.btn.ghost{background:none;border:1px solid var(--line2);color:var(--text2);font-weight:500}
.btn.danger{background:none;border:1px solid rgba(229,100,110,.5);color:var(--bad);font-weight:500}
.btns{display:grid;gap:8px;margin-top:8px}

.toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translate(-50%,20px);background:var(--surface2);border:1px solid var(--line2);
  color:var(--text);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- onboarding ---------- */
.onb{padding:calc(var(--safe-t) + 34px) 20px 40px;max-width:520px;margin:0 auto}
.onb .logo{width:84px;height:84px;border-radius:22px;display:block;margin:0 auto 14px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.onb h1{font-family:Georgia,"Times New Roman",serif;font-weight:600;text-align:center;margin:0 0 4px;font-size:30px}
.onb p.sub{text-align:center;color:var(--text2);margin:0 0 26px}

/* ---------- v2: accantonamenti, obiettivi, ricerca, categorie ---------- */
.split3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);position:relative;z-index:1}
.split3 small{display:block;font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.7px}
.split3 b{font-size:15px;font-weight:600}
.mb{height:5px;background:var(--surface2);border-radius:3px;overflow:hidden;margin-top:6px}
.mb i{display:block;height:100%;border-radius:3px;max-width:100%}
.card.inset{background:var(--bg);margin-bottom:12px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 4px 0 12px;margin-bottom:12px}
.search:focus-within{border-color:var(--gold)}
.search input{flex:1;min-width:0;background:none;border:0;outline:none;padding:12px 0;font-size:15px}
.search input::-webkit-search-cancel-button{display:none}
.search button{border:0;background:none;color:var(--muted);width:36px;height:36px;font-size:15px}
.chips.wrap{flex-wrap:wrap;overflow:visible;margin-bottom:14px}
.seg.small button{font-size:13px;padding:9px 2px}
.cat{hyphens:auto;overflow-wrap:anywhere}
.emos{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin:0 0 14px}
.emos button{font-size:20px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px 0;line-height:1.2}
.row .ic{margin-right:2px}
</style>
</head>
<body>

<div id="app"></div>
<div class="overlay" id="ov"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept="application/json,.json" hidden>

<script>
'use strict';
/* =========================================================
   Salvadanaio — gestione della liquidità personale
   Tutti i dati restano nel telefono (localStorage).
   ========================================================= */
const KEY='salvadanaio.v1';
const APP_VERSION='2.0';
const DATA_V=2;

/* ---------------- categorie ---------------- */
const DEF_OUT=[
  ['spesa','Spesa','🛒'],['casa','Casa e bollette','🏠'],['auto','Auto e trasporti','⛽'],['bar','Bar e ristoranti','☕'],
  ['salute','Salute','💊'],['abbigl','Abbigliamento','👔'],['svago','Svago e viaggi','🎭'],['abbon','Abbonamenti','📱'],
  ['regali','Regali','🎁'],['banca','Tasse e banca','🏛️'],['cura','Cura persona','✂️'],['altro','Altro','📦']
];
const DEF_IN=[
  ['stip','Stipendio','💼'],['mens','13ª / 14ª','⭐'],['rimb','Rimborsi','↩️'],['regin','Regali','🎁'],['altroin','Altre entrate','➕']
];
const SPECIAL={adj:{id:'adj',name:'Rettifica saldo',e:'⚖️'},tr:{id:'tr',name:'Prelevamento',e:'🏧'},fund:{id:'fund',name:'Accantonamenti',e:'🐷'}};
const EMOJIS='🛒 🏠 ⛽ ☕ 💊 👔 🎭 📱 🎁 🏛️ ✂️ 📦 🍕 🍷 🍔 🚗 🛵 🚆 ✈️ 🏖️ 🎬 🎮 🎵 📚 🎓 🏋️ ⚽ 🐶 🐱 👶 🧸 💅 🦷 👓 🏥 💡 💧 🔥 🧾 🔧 🧹 🌿 💻 🎄 💍 🚬 💼 ⭐ ↩️ ➕ 💶 🎯'.split(' ');
let catMap={};
function buildCats(){
  catMap={};
  if(S&&S.cats)[...S.cats.out,...S.cats.in].forEach(c=>catMap[c.id]=c);
  Object.values(SPECIAL).forEach(c=>catMap[c.id]=c);
}
const catOf=id=>catMap[id]||catMap.altro||{id:'altro',name:'Altro',e:'📦'};
const catList=(type,keep)=>S.cats[type].filter(c=>!c.hidden||c.id===keep);
const catGrid=(list,sel)=>`<div class="cats">${list.map(c=>`<button class="cat ${sel===c.id?'on':''}" data-c="${c.id}"><span class="e">${c.e}</span>${esc(c.name)}</button>`).join('')}</div>`;
const WNAME={conto:'Conto corrente',contanti:'Contanti'};
const WSHORT={conto:'Conto',contanti:'Contanti'};

/* ---------------- storage ---------------- */
let S=null, REV=0;
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}}
function save(){REV++;buildCats();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Errore di salvataggio!')}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
/* aggiorna i dati delle versioni precedenti senza perdere nulla */
function migrate(d){
  d.settings=d.settings||{};
  if(d.settings.alignDays==null)d.settings.alignDays=14;
  d.goalOv=d.goalOv||{}; d.tx=d.tx||[]; d.recurring=d.recurring||[];
  d.funds=d.funds||[]; d.goals=d.goals||[];
  if(!d.cats)d.cats={out:DEF_OUT.map(([id,name,e])=>({id,name,e})),in:DEF_IN.map(([id,name,e])=>({id,name,e}))};
  if(!d.lastAlign){
    d.lastAlign={};
    for(const w of ['conto','contanti']){
      const adj=d.tx.filter(t=>t.type==='adj'&&t.wallet===w).map(t=>t.date).sort().pop();
      d.lastAlign[w]=adj||d.setup||today();
    }
  }
  d.v=DATA_V;
  return d;
}

/* ---------------- date utils ---------------- */
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
const parseD=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const mKey=s=>s.slice(0,7);
const dim=m=>{const [y,mm]=m.split('-').map(Number);return new Date(y,mm,0).getDate()};
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return ymd(d)};
const diffDays=(a,b)=>Math.round((parseD(a)-parseD(b))/864e5);
const addMonths=(m,n)=>{const [y,mm]=m.split('-').map(Number);const d=new Date(y,mm-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)};
const mDiff=(a,b)=>{const [ya,ma]=a.split('-').map(Number),[yb,mb]=b.split('-').map(Number);return (yb-ya)*12+(mb-ma)};
const MESI=['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
const MESI3=['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
const GIORNI=['domenica','lunedì','martedì','mercoledì','giovedì','venerdì','sabato'];
const monthLabel=m=>{const [y,mm]=m.split('-').map(Number);return MESI[mm-1]+' '+y};
const monthShort=m=>{const [y,mm]=m.split('-').map(Number);return MESI3[mm-1]+' '+y};
const dayLabel=s=>{const d=parseD(s);const t=today();
  if(s===t)return 'Oggi'; if(s===addDays(t,-1))return 'Ieri';
  return GIORNI[d.getDay()]+' '+d.getDate()+' '+MESI[d.getMonth()]};
const shortD=s=>{const d=parseD(s);return d.getDate()+' '+MESI3[d.getMonth()]};

/* ---------------- money utils ---------------- */
// Formattazione italiana con il punto delle migliaia SEMPRE (Intl it-IT non lo mette sotto 10.000)
const HIDE_KEY='salvadanaio.hide';
let HIDE=false; try{HIDE=localStorage.getItem(HIDE_KEY)==='1'}catch(e){}
const MASK='••••';
function grp(intStr){return intStr.replace(/\B(?=(\d{3})+(?!\d))/g,'.')}
function numIt(v,dec){
  const neg=v<0; const a=Math.abs(v);
  const s=dec?a.toFixed(2):String(Math.round(a));
  const [i,d]=s.split('.');
  return (neg&&Number(s)!==0?'-':'')+grp(i)+(d?','+d:'');
}
const eur=v=>HIDE?MASK+' €':numIt(Math.round(v*100)/100,true)+' €';
const eur0=v=>HIDE?MASK+' €':numIt(v,false)+' €';
const r2=v=>Math.round(v*100)/100;
function parseAmt(s){
  if(s==null)return NaN; s=String(s).trim().replace(/\s|€/g,'');
  if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');
  else if(/^-?\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
  const v=parseFloat(s); return isFinite(v)?r2(v):NaN;
}
const amtIn=v=>{if(!v)return '';const r=r2(v);return Number.isInteger(r)?grp(String(r)):numIt(r,true)};
// campo importo: mette i punti delle migliaia mentre scrivi; il punto digitato vale come virgola decimale
function liveAmount(inp){
  if(!inp)return;
  let prev=inp.value;
  inp.addEventListener('input',()=>{
    let v=inp.value;
    const typedDot=v.length>prev.length&&v.endsWith('.')&&!v.slice(0,-1).includes(',');
    if(typedDot)v=v.slice(0,-1)+',';
    const neg=inp.dataset.neg==='1'&&v.trim().startsWith('-');
    v=v.replace(/[^0-9,]/g,'');
    const ci=v.indexOf(',');
    let ip=ci>=0?v.slice(0,ci):v, dp=ci>=0?v.slice(ci+1).replace(/,/g,'').slice(0,2):null;
    ip=ip.replace(/^0+(?=\d)/,'');
    if(ip===''&&dp!==null)ip='0';
    inp.value=(neg?'-':'')+grp(ip)+(dp!==null?','+dp:'');
    prev=inp.value;
    inp.dispatchEvent(new Event('amount'));
  });
}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s??'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');

/* =========================================================
   CALCOLI
   ========================================================= */
function balance(w){
  let b=S.wallets[w].init||0;
  for(const t of S.tx){
    if(t.type==='in'&&t.wallet===w)b+=t.amount;
    else if(t.type==='out'&&t.wallet===w)b-=t.amount;
    else if(t.type==='adj'&&t.wallet===w)b+=t.amount;
    else if(t.type==='tr'){if(t.wallet===w)b-=t.amount; if(t.to===w)b+=t.amount;}
  }
  return r2(b);
}

/* Accantonamenti e obiettivi.
   ACCANTONAMENTO: ogni mese la quota = (importo − già da parte) / mesi mancanti alla scadenza.
     La quota conta come spesa fissa del mese. Il pagamento collegato è "coperto" dal fondo
     (non conta di nuovo come spesa); l'eventuale eccedenza oltre il fondo conta come spesa normale.
   OBIETTIVO: i versamenti sono soldi segnati come messi da parte (restano sul conto).
     Una spesa collegata all'obiettivo è coperta dal saldo dell'obiettivo. */
let ENG=null;
function engine(){
  const key=REV+'|'+today();
  if(ENG&&ENG.key===key)return ENG;
  const cur=mKey(today());
  const covered={}, fundInfo={}, goalInfo={}, quotaByM={};
  const linked=id=>S.tx.filter(t=>t.fund===id&&t.type==='out').sort((a,b)=>a.date.localeCompare(b.date)||(a.ts||0)-(b.ts||0));
  for(const f of S.funds){
    const every=Math.max(1,f.every||12), pays=linked(f.id), q={};
    let bal=r2(f.init||0), lastPaid=null, pi=0;
    const dueAfter=(m,strictAfter)=>{let d=f.due; while(d<m||(strictAfter&&d<=strictAfter))d=addMonths(d,every); return d};
    let endM=cur; if(pays.length){const lp=mKey(pays[pays.length-1].date); if(lp>endM)endM=lp}
    for(let m=f.start; m<=endM; m=addMonths(m,1)){
      const nd=dueAfter(m,lastPaid), left=mDiff(m,nd)+1;
      const qq=Math.max(0,r2((f.amount-bal)/left));
      bal=r2(bal+qq); q[m]=qq; quotaByM[m]=r2((quotaByM[m]||0)+qq);
      while(pi<pays.length&&mKey(pays[pi].date)<=m){
        const p=pays[pi++];
        const cov=r2(Math.min(p.amount,Math.max(0,bal)));
        bal=r2(bal-cov); covered[p.id]=r2((covered[p.id]||0)+cov);
        lastPaid=dueAfter(f.due,lastPaid); // il pagamento chiude la prima scadenza non ancora pagata
      }
    }
    const nd=dueAfter(cur,lastPaid);
    fundInfo[f.id]={bal,quota:q[cur]||0,nextDue:nd,monthsLeft:mDiff(cur,nd)+1,ready:bal>=f.amount-0.005,pct:f.amount>0?Math.min(100,Math.max(0,bal/f.amount*100)):0};
  }
  for(const g of S.goals){
    const ev=[...(g.moves||[]).map(x=>({d:x.date,a:x.amount,ts:x.ts||0})),...linked(g.id).map(t=>({d:t.date,t,ts:t.ts||0}))]
      .sort((a,b)=>a.d.localeCompare(b.d)||a.ts-b.ts);
    // dep = messo da parte (versamenti − ritiri): misura l'avanzamento.
    // bal = ancora disponibile (dep − spese già fatte con questi soldi): conta come "da parte" nella liquidità.
    let bal=0, dep=0, spent=0;
    for(const e of ev){
      if(!e.t){bal=r2(bal+e.a);dep=r2(dep+e.a);continue}
      const cov=r2(Math.min(e.t.amount,Math.max(0,bal))); bal=r2(bal-cov); spent=r2(spent+cov); covered[e.t.id]=cov;
    }
    const thisM=r2((g.moves||[]).filter(x=>!x.init&&x.date.startsWith(cur)).reduce((s,x)=>s+x.amount,0));
    const left=g.deadline?Math.max(1,mDiff(cur,g.deadline)+1):null;
    const need=Math.max(0,r2(g.target-dep));
    const monthly=left?Math.max(0,r2((g.target-(dep-thisM))/left)):null;
    goalInfo[g.id]={bal,dep,spent,need,left,thisM,monthly,todo:monthly!=null?Math.max(0,r2(monthly-thisM)):null,
      done:need<=0.005,late:!!(g.deadline&&g.deadline<cur),pct:g.target>0?Math.min(100,Math.max(0,dep/g.target*100)):0};
  }
  ENG={key,covered,fundInfo,goalInfo,quotaByM};
  return ENG;
}
const fundById=id=>S.funds.find(f=>f.id===id)||S.goals.find(g=>g.id===id);
const isGoal=id=>S.goals.some(g=>g.id===id);

// spesa: uscite + rettifiche negative (soldi spariti senza registrazione), al netto della parte coperta da accantonamenti/obiettivi
function spendOf(t){return t.type==='out'?t.amount:(t.type==='adj'&&t.amount<0?-t.amount:0)}
function effSpend(t){const v=spendOf(t);return v?r2(v-(engine().covered[t.id]||0)):0}
function incOf(t){return t.type==='in'?t.amount:(t.type==='adj'&&t.amount>0?t.amount:0)}
function spendBetween(a,b,varOnly){let s=0;for(const t of S.tx)if(t.date>=a&&t.date<=b&&!(varOnly&&t.rec))s+=effSpend(t);return r2(s)}
// spese fisse del mese = ricorrenti in uscita (importo reale se già registrato, altrimenti quello previsto)
function fixedOf(m){
  let f=0;
  for(const r of S.recurring||[]){
    if(r.type!=='out')continue;
    const tx=S.tx.find(x=>x.rec===r.id&&x.recM===m);
    if(tx){f+=tx.amount;continue}
    const d=m+'-'+pad(Math.min(r.day,dim(m)));
    if(r.active&&d>=r.start&&!(r.skip||[]).includes(m))f+=r.amount;
  }
  return r2(f);
}
function flows(m){
  let inc=0,real=0,cov=0;
  for(const t of S.tx)if(t.date.startsWith(m)){inc+=incOf(t);real+=effSpend(t);cov+=engine().covered[t.id]||0}
  const quota=engine().quotaByM[m]||0;
  return{inc:r2(inc),real:r2(real),quota,out:r2(real+quota),covered:r2(cov)};
}
function goalOf(m){return S.goalOv&&S.goalOv[m]!=null?S.goalOv[m]:(S.settings.goal||0)}

function weeksOf(m){
  const first=m+'-01', last=m+'-'+pad(dim(m)); const res=[]; let s=first;
  while(s<=last){
    const dow=(parseD(s).getDay()+6)%7; // 0 = lunedì
    let e=addDays(s,6-dow); if(e>last)e=last;
    res.push({start:s,end:e}); s=addDays(e,1);
  }
  return res;
}
/* Piano del mese:
   entrate attese = max(stipendio previsto, entrate registrate)
   budget spese   = entrate attese − obiettivo di risparmio
   spese fisse    = ricorrenti + quote degli accantonamenti (escluse dal budget settimanale)
   budget della settimana = budget variabile residuo a inizio settimana, ripartito sui giorni rimasti del mese */
function plan(m,ref){
  const f=flows(m);
  const income=Math.max(S.settings.salary||0,f.inc);
  const goal=goalOf(m);
  const budget=r2(income-goal);
  const recPlanned=fixedOf(m);
  const fixed=r2(recPlanned+f.quota), varBudget=r2(budget-fixed);
  const first=m+'-01', last=m+'-'+pad(dim(m));
  const weeks=weeksOf(m).map((w,i)=>{
    const before=w.start>first?spendBetween(first,addDays(w.start,-1),true):0;
    const remaining=varBudget-before;
    const daysRem=diffDays(last,w.start)+1, len=diffDays(w.end,w.start)+1;
    const wb=r2(Math.max(0,remaining)*len/daysRem);
    const spent=spendBetween(w.start,w.end,true);
    return {...w,i:i+1,budget:wb,spent,cur:ref>=w.start&&ref<=w.end,future:ref<w.start};
  });
  const day=Math.min(Math.max(diffDays(ref,first)+1,1),dim(m));
  const elapsed=day/dim(m);
  const varOut=spendBetween(first,last,true);
  const recOut=r2(f.real-varOut);
  const projected=r2(income-f.quota-Math.max(recPlanned,recOut)-varOut/elapsed);
  return {m,inc:f.inc,out:f.out,quota:f.quota,income,goal,budget,fixed,varBudget,weeks,elapsed,day,remainingBudget:r2(budget-f.out),saving:r2(income-f.out),projected};
}
function status(spent,budget,elapsed){
  if(budget<=0) return spent>0?'bad':'good';
  const r=spent/budget;
  if(r>1) return 'bad';
  if(elapsed!=null){ if(r<=elapsed+0.05) return 'good'; return 'warn'; }
  return r>0.85?'warn':'good';
}
const ST={good:{c:'var(--good)',l:'In linea',i:'✓'},warn:{c:'var(--warn)',l:'Sopra il ritmo',i:'!'},bad:{c:'var(--bad)',l:'Fuori budget',i:'✕'}};

/* ---------------- recurring ---------------- */
function runRecurring(){
  const t=today(); let added=0;
  for(const r of S.recurring||[]){
    if(!r.active)continue;
    let m=mKey(r.start); const endM=mKey(t);
    while(m<=endM){
      const d=m+'-'+pad(Math.min(r.day,dim(m)));
      if(d>=r.start&&d<=t&&!(r.skip||[]).includes(m)&&!S.tx.some(x=>x.rec===r.id&&x.recM===m)){
        S.tx.push({id:uid(),date:d,type:r.type,amount:r.amount,wallet:r.wallet,cat:r.cat,note:r.name,rec:r.id,recM:m,ts:Date.now()});
        added++;
      }
      m=addMonths(m,1);
    }
  }
  if(added){save();setTimeout(()=>toast(added===1?'1 movimento ricorrente aggiunto':added+' movimenti ricorrenti aggiunti'),400)}
}

const $=s=>document.querySelector(s);
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2200)}
/* ---- navigazione con il tasto "indietro" di Android ----
   Ogni finestra aperta e ogni pagina diversa dalla Home aggiunge un passo alla cronologia:
   "indietro" chiude la finestra, poi riporta alla Home, e solo dalla Home esce dall'app. */
let ignorePop=0;
let sheetWanted=false;
const sheetOpen=()=>sheetWanted;
function openSheet(html,onReady){
  const sh=$('#sheet');
  if(!sheetOpen())history.pushState({sheet:1},'');
  sheetWanted=true;
  sh.innerHTML='<div class="grab"></div><button class="shx" id="shX" aria-label="Chiudi senza salvare">✕</button>'+html; sh.scrollTop=0;
  $('#shX').onclick=()=>closeSheet();
  $('#ov').classList.add('on');
  if(sh.classList.contains('on'))return onReady&&onReady(sh);
  requestAnimationFrame(()=>{if(sheetWanted)sh.classList.add('on')});
  onReady&&onReady(sh);
}
function closeSheet(fromBack){
  if(!sheetOpen())return;
  sheetWanted=false;
  $('#sheet').classList.remove('on');$('#ov').classList.remove('on');
  if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
  if(!fromBack&&history.state&&history.state.sheet){ignorePop++;history.back()}
}
$('#ov').onclick=()=>closeSheet();
function go(v){
  if(v===VIEW){window.scrollTo(0,0);return}
  if(v==='home'){
    if(history.state&&history.state.view){ignorePop++;history.back()}
  }else if(history.state&&history.state.view)history.replaceState({view:v},'');
  else history.pushState({view:v},'');
  VIEW=v;render();window.scrollTo(0,0);
}
window.addEventListener('popstate',()=>{
  if(ignorePop>0){ignorePop--;return}
  if(sheetOpen()){closeSheet(true);return}
  if(VIEW!=='home'){VIEW='home';render();window.scrollTo(0,0)}
});

function sortTx(a,b){return b.date.localeCompare(a.date)||(b.ts||0)-(a.ts||0)}
function txRow(t,withYear){
  const c=catOf(t.cat);
  let sign='-',cls='',sub=WSHORT[t.wallet];
  if(t.type==='in'){sign='+';cls='pos'}
  else if(t.type==='adj'){sign=t.amount>=0?'+':'-';cls=t.amount>=0?'pos':''}
  else if(t.type==='tr'){sign='';cls='t2';sub=WSHORT[t.wallet]+' → '+WSHORT[t.to]}
  const title=t.note?esc(t.note):(t.type==='tr'?(t.wallet==='conto'?'Prelevamento':'Versamento'):c.name);
  const extra=t.note&&t.type!=='tr'&&t.note!==c.name?esc(c.name)+' · ':'';
  const fd=t.fund&&fundById(t.fund);
  const fl=fd?` · ${isGoal(t.fund)?'🎯':'🐷'} ${esc(fd.name)}`:'';
  return `<button class="tx" data-id="${t.id}"><div class="ic">${c.e}</div>
    <div class="mid"><b>${title}</b><small>${extra}${sub}${t.rec?' · 🔁':''}${fl} · ${shortD(t.date)}${withYear?' '+t.date.slice(0,4):''}</small></div>
    <div class="amt num ${cls}">${sign}${eur(Math.abs(t.amount))}</div></button>`;
}
function bindTxRows(scope){document.querySelectorAll(scope+' .tx[data-id]').forEach(b=>b.onclick=()=>{const t=S.tx.find(x=>x.id===b.dataset.id);t&&txSheet(t)})}

function renderMov(){

  const q=$('#q');
  q.oninput=()=>{MOV_Q=q.value;$('#qx').style.visibility=MOV_Q?'visible':'hidden';renderMovBody()};
  $('#qx').onclick=()=>{MOV_Q='';q.value='';$('#qx').style.visibility='hidden';renderMovBody();q.focus()};
  renderMovBody();
}
function txText(t){
  const c=catOf(t.cat), fd=t.fund&&fundById(t.fund);
  const T={in:'entrata',out:'uscita spesa',adj:'rettifica saldo',tr:t.wallet==='conto'?'prelevamento bancomat':'versamento'};
  return norm([t.note,c.name,WNAME[t.wallet],t.to?WNAME[t.to]:'',T[t.type],fd?fd.name:'',
    numIt(t.amount,true),numIt(t.amount,false),String(t.amount).replace('.',',')].join(' | '));
}
function renderMovBody(){
  const body=$('#movBody'); let html='';
  const qs=norm(MOV_Q).trim();
  if(qs){
    const words=qs.split(/\s+/);
    const res=S.tx.filter(t=>{const s=txText(t);return words.every(w=>s.includes(w))}).sort(sortTx);
    let out=0,inc=0; for(const t of res){out+=spendOf(t);inc+=incOf(t)}
    html+=`<div class="card"><div class="tot3">
      <div><small>Trovati</small><b class="num">${res.length}</b></div>
      <div><small>Uscite</small><b class="num neg">${eur0(out)}</b></div>
      <div><small>Entrate</small><b class="num pos">${eur0(inc)}</b></div></div></div>
      <div class="card" style="padding-top:4px">`;
    if(!res.length)html+='<div class="empty">Nessun movimento trovato.</div>';
    let lastM='';
    for(const t of res.slice(0,300)){const mm=mKey(t.date);if(mm!==lastM){html+=`<div class="day-h">${monthLabel(mm)}</div>`;lastM=mm}html+=txRow(t)}
    if(res.length>300)html+=`<div class="empty">Mostrati i primi 300 risultati.</div>`;
    html+='</div>';
    body.innerHTML=html; bindTxRows('#movBody'); return;
  }
  const list=S.tx.filter(t=>t.date.startsWith(MOV_M)&&(MOV_W==='all'||t.wallet===MOV_W||t.to===MOV_W)).sort(sortTx);
  const f=flows(MOV_M);
  html+=`<div class="monthnav"><button class="iconbtn" id="mPrev">‹</button><b>${monthLabel(MOV_M)}</b><button class="iconbtn" id="mNext">›</button></div>
  <div class="chips">${[['all','Tutti'],['conto','🏦 Conto'],['contanti','💶 Contanti']].map(([k,l])=>`<button class="chip ${MOV_W===k?'on':''}" data-f="${k}">${l}</button>`).join('')}</div>
  <div class="card"><div class="tot3">
    <div><small>Entrate</small><b class="num pos">${eur0(f.inc)}</b></div>
    <div><small>Uscite</small><b class="num neg">${eur0(f.out)}</b></div>
    <div><small>Risparmio</small><b class="num ${f.inc-f.out>=0?'':'neg'}">${eur0(f.inc-f.out)}</b></div></div>
    ${f.quota>0||f.covered>0?`<p class="note" style="margin-top:10px;font-size:12px">${f.quota>0?`Le uscite includono ${eur0(f.quota)} di quote per gli accantonamenti. `:''}${f.covered>0?`${eur0(f.covered)} pagati con soldi già messi da parte non sono contati di nuovo.`:''}</p>`:''}</div>
  <div class="card" style="padding-top:4px">`;
  if(!list.length)html+='<div class="empty">Nessun movimento in questo mese.</div>';
  let lastD='';
  for(const t of list){if(t.date!==lastD){html+=`<div class="day-h">${dayLabel(t.date)}</div>`;lastD=t.date}html+=txRow(t)}
  html+='</div>';
  body.innerHTML=html;
  $('#mPrev').onclick=()=>{MOV_M=addMonths(MOV_M,-1);renderMovBody()};
  $('#mNext').onclick=()=>{MOV_M=addMonths(MOV_M,1);renderMovBody()};
  document.querySelectorAll('#movBody [data-f]').forEach(b=>b.onclick=()=>{MOV_W=b.dataset.f;renderMovBody()});
  bindTxRows('#movBody');
}

function renderAn(){
  AN_M=AN_M||mKey(today());

  for(const t of S.tx)if(t.date.startsWith(AN_M)){const v=effSpend(t);if(v>0){const k=t.type==='adj'?'adj':t.cat;byCat[k]=(byCat[k]||0)+v;tot+=v}}
  const qm=engine().quotaByM[AN_M]||0; if(qm>0){byCat.fund=qm;tot+=qm}
  const cats=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);

  // storico ultimi 12 mesi (dal primo mese di utilizzo)

      <div><div class="cn"><span>${esc(c.name)}</span><small class="num">${Math.round(v/tot*100)}%</small></div><div class="cb"><i style="width:${v/max*100}%"></i></div></div>
      <div class="cv num">${eur(v)}</div></div>`}).join(''):'<div class="empty">Nessuna spesa in questo mese.</div>'}
  </div>
  <div class="card"><h3>Risparmio mese per mese</h3>
    ${histChart(hist)}

  </div>`;
  $('#aPrev').onclick=()=>{AN_M=addMonths(AN_M,-1);renderAn()};
  $('#aNext').onclick=()=>{AN_M=addMonths(AN_M,1);renderAn()};
  document.querySelectorAll('#v-an [data-hm]').forEach(g=>g.onclick=()=>{
    const h=hist.find(x=>x.m===g.dataset.hm);
    document.querySelectorAll('#v-an [data-hm] .b').forEach(r=>r.style.opacity=.55);
    g.querySelector('.b').style.opacity=1;
    const diff=r2(h.sav-h.goal);
    $('#hd').innerHTML=`<b style="text-transform:capitalize">${monthLabel(h.m)}</b>${h.cur?' (in corso)':''}: risparmio <b class="num">${eur(h.sav)}</b> · obiettivo ${eur0(h.goal)} · <span class="${diff>=0?'pos':'neg'}">${diff>=0?'+':''}${eur(diff)}</span>`;
  });
}
function histChart(h){
  if(!h.length)return '<div class="empty">Ancora nessun dato.</div>';
  const W=520,H=210,pl=6,pr=6,pt=24,pb=26;
  const vals=h.flatMap(x=>[x.sav,x.goal]);
  let mx=Math.max(0,...vals), mn=Math.min(0,...vals); if(mx===mn)mx=mn+1;
  const y=v=>pt+(mx-v)/(mx-mn)*(H-pt-pb);
  const slot=(W-pl-pr)/Math.max(h.length,6), bw=Math.min(34,slot*0.58);
  const k=v=>HIDE?MASK:numIt(v,false);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Risparmio mensile">`;
  s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line2)" stroke-width="1"/>`;
  h.forEach((d,i)=>{
    const cx=pl+slot*i+slot/2, x=cx-bw/2, y0=y(0), yv=y(d.sav);
    const top=Math.min(y0,yv), hh=Math.max(2,Math.abs(yv-y0));
    const col=d.sav>=0?'var(--gold)':'var(--bad)';
    const rr=Math.min(4,hh/2);
    const path=d.sav>=0
      ?`M${x},${top+hh} V${top+rr} Q${x},${top} ${x+rr},${top} H${x+bw-rr} Q${x+bw},${top} ${x+bw},${top+rr} V${top+hh} Z`
      :`M${x},${top} V${top+hh-rr} Q${x},${top+hh} ${x+rr},${top+hh} H${x+bw-rr} Q${x+bw},${top+hh} ${x+bw},${top+hh-rr} V${top} Z`;
    const [yy,mm]=d.m.split('-');
    s+=`<g data-hm="${d.m}" style="cursor:pointer"><rect x="${cx-slot/2}" y="0" width="${slot}" height="${H}" fill="transparent"/>
      <path class="b" d="${path}" fill="${col}" ${d.cur?'fill-opacity=".55"':''}/>
      <line x1="${x-3}" x2="${x+bw+3}" y1="${y(d.goal)}" y2="${y(d.goal)}" stroke="var(--text)" stroke-width="2" stroke-linecap="round" opacity=".8"/>
      <text x="${cx}" y="${d.sav>=0?top-6:y0-6}" text-anchor="middle" font-size="11" fill="var(--text2)">${k(d.sav)}</text>
      <text x="${cx}" y="${H-8}" text-anchor="middle" font-size="11" fill="${d.cur?'var(--gold2)':'var(--muted)'}">${MESI3[+mm-1]}</text></g>`;
  });
  return s+'</svg>';
}

function txSheet(t,preset){
  const edit=!!t;
  const st=t?{...t}:{type:'out',amount:null,wallet:'conto',to:'contanti',cat:null,date:today(),note:'',fund:null,...(preset||{})};
  if(st.type==='adj'){ // rettifica: solo eliminazione
    openSheet(`<h2>Rettifica saldo</h2><p class="t2">${WNAME[st.wallet]} · ${dayLabel(st.date)}<br>Importo: <b class="num">${eur(st.amount)}</b></p>
      <p class="note">Creata allineando il saldo. Se la elimini, il saldo torna com'era prima.</p>
      <div class="btns"><button class="btn danger" id="del">Elimina rettifica</button><button class="btn ghost" id="cl">Chiudi</button></div>`,()=>{
      $('#cl').onclick=()=>closeSheet(); $('#del').onclick=()=>{S.tx=S.tx.filter(x=>x.id!==st.id);save();closeSheet();render();toast('Rettifica eliminata')}});
    return;
  }
  const sources=[...S.funds.map(f=>({id:f.id,name:f.name,e:'🐷'})),...S.goals.map(g=>({id:g.id,name:g.name,e:'🎯'}))];
  function draw(){
    const cats=catList(st.type==='in'?'in':'out',st.cat);
    openSheet(`<h2>${edit?'Modifica movimento':'Nuovo movimento'}</h2>
      <div class="seg t-${st.type}" id="tp">${[['out','Uscita'],['in','Entrata'],['tr','Prelevamento']].map(([k,l])=>`<button data-t="${k}" class="${st.type===k?'on':''}">${l}</button>`).join('')}</div>
      <div class="amount"><span>€</span><input id="am" inputmode="decimal" placeholder="0,00" value="${amtIn(st.amount)}" autocomplete="off"></div>
      ${st.type==='tr'?`
        <div class="lbl">Tipo di operazione</div>
        <div class="seg" id="dir"><button data-d="conto" class="${st.wallet==='conto'?'on':''}">Prelevamento<br><small class="muted">conto → contanti</small></button><button data-d="contanti" class="${st.wallet==='contanti'?'on':''}">Versamento<br><small class="muted">contanti → conto</small></button></div>
        <p class="note" style="margin:-4px 0 14px">Un prelevamento al bancomat non è una spesa: sposta solo i soldi dal conto al portafoglio.</p>`
      :`
        <div class="lbl">${st.type==='in'?'Accredito su':'Pagato con'}</div>
        <div class="seg" id="wl"><button data-w="conto" class="${st.wallet==='conto'?'on':''}">🏦 ${st.type==='in'?'Conto':'Conto / carta'}</button><button data-w="contanti" class="${st.wallet==='contanti'?'on':''}">💶 Contanti</button></div>
        <div class="lbl">Categoria</div>
        ${catGrid(cats,st.cat)}
        ${st.type==='out'&&sources.length?`<div class="lbl">Usa soldi messi da parte</div>
          <div class="chips wrap" id="src"><button class="chip ${!st.fund?'on':''}" data-src="">No</button>${sources.map(s=>`<button class="chip ${st.fund===s.id?'on':''}" data-src="${s.id}">${s.e} ${esc(s.name)}</button>`).join('')}</div>`:''}`}
      <div class="two">
        <div class="field"><label>Data</label><input type="date" id="dt" value="${st.date}"></div>
        <div class="field"><label>Nota</label><input id="nt" placeholder="facoltativa" value="${esc(st.note)}" maxlength="60"></div>
      </div>
      <button class="btn" id="ok">${edit?'Salva modifiche':'Registra'}</button>
      ${edit?'<button class="btn danger" id="del" style="margin-top:8px">Elimina</button>':''}`,sh=>{
      const am=$('#am'); liveAmount(am);
      const keep=()=>{st.amount=parseAmt(am.value);st.date=$('#dt').value||today();st.note=$('#nt').value.trim()};
      sh.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{keep();if(st.type!==b.dataset.t){st.type=b.dataset.t;st.cat=null;st.fund=null;if(st.type==='tr'){st.wallet='conto';st.to='contanti'}}draw()});
      sh.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{st.wallet=b.dataset.w;sh.querySelectorAll('[data-w]').forEach(x=>x.classList.toggle('on',x===b))});
      sh.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{st.wallet=b.dataset.d;st.to=b.dataset.d==='conto'?'contanti':'conto';sh.querySelectorAll('[data-d]').forEach(x=>x.classList.toggle('on',x===b))});
      sh.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{st.cat=b.dataset.c;sh.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b))});
      sh.querySelectorAll('[data-src]').forEach(b=>b.onclick=()=>{
        st.fund=b.dataset.src||null;sh.querySelectorAll('[data-src]').forEach(x=>x.classList.toggle('on',x===b));
        const f=st.fund&&S.funds.find(x=>x.id===st.fund);
        if(f&&!st.cat){st.cat=f.cat;sh.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x.dataset.c===st.cat))}
      });
      $('#ok').onclick=()=>{
        keep();
        if(!(st.amount>0)){toast('Inserisci un importo');am.focus();return}
        if(st.type!=='tr'&&!st.cat){toast('Scegli una categoria');return}
        if(st.type==='tr'){st.cat='tr';st.to=st.wallet==='conto'?'contanti':'conto'}else delete st.to;
        if(st.type!=='out'||!st.fund)delete st.fund;
        if(edit){const i=S.tx.findIndex(x=>x.id===st.id);S.tx[i]=st}
        else{st.id=uid();st.ts=Date.now();S.tx.push(st)}
        save();closeSheet();render();toast(edit?'Movimento aggiornato':'Registrato ✓');
      };
      edit&&($('#del').onclick=()=>{
        if(!confirm('Eliminare questo movimento?'))return;
        if(st.rec){const r=(S.recurring||[]).find(x=>x.id===st.rec);if(r){r.skip=r.skip||[];r.skip.push(st.recM)}}
        S.tx=S.tx.filter(x=>x.id!==st.id);save();closeSheet();render();toast('Movimento eliminato')});
      if(!edit&&!st.amount)setTimeout(()=>am.focus(),280);
    });
  }
  draw();
}

function markAligned(w){S.lastAlign=S.lastAlign||{};S.lastAlign[w]=today()}
function alignSheet(w){
  const cur=balance(w);
  openSheet(`<h2>Allinea ${WNAME[w].toLowerCase()}</h2>
    <p class="t2" style="margin-top:-6px">Saldo secondo l'app: <b class="num">${eur(cur)}</b></p>
    <button class="btn ghost" id="same" style="margin:0 0 16px">✓ È corretto, il saldo coincide</button>
    <div class="lbl">Altrimenti inserisci ${w==='conto'?'il saldo reale in banca':'i contanti che hai davvero'}</div>
    <div class="amount"><span>€</span><input id="am" inputmode="decimal" data-neg="1" placeholder="0,00" autocomplete="off"></div>
    <p class="note" id="df" style="text-align:center;min-height:20px"></p>
    <p class="note">La differenza viene registrata come <b>rettifica</b>: se è negativa conta come spesa non registrata, così il risparmio resta realistico.</p>
    <button class="btn" id="ok">Allinea</button>`,()=>{
    const am=$('#am'); liveAmount(am);
    am.addEventListener('amount',()=>{const v=parseAmt(am.value);$('#df').innerHTML=isFinite(v)?`Differenza: <b class="num ${v-cur>=0?'pos':'neg'}">${v-cur>=0?'+':''}${eur(v-cur)}</b>`:''});
    $('#same').onclick=()=>{markAligned(w);save();closeSheet();render();toast('Saldo verificato ✓')};
    $('#ok').onclick=()=>{
      const v=parseAmt(am.value); if(!isFinite(v)){toast('Inserisci il saldo');return}
      const d=r2(v-cur); markAligned(w);
      if(Math.abs(d)<0.005){save();closeSheet();render();toast('Già allineato ✓');return}
      S.tx.push({id:uid(),date:today(),type:'adj',amount:d,wallet:w,cat:'adj',note:'',ts:Date.now()});
      save();closeSheet();render();toast('Saldo allineato ✓');
    };
  });
}

      <div class="two">
        <div class="field"><label>Importo €</label><input id="am" inputmode="decimal" value="${amtIn(st.amount)}" placeholder="0,00"></div>
        <div class="field"><label>Giorno del mese</label><input id="dy" type="number" inputmode="numeric" min="1" max="31" value="${st.day}"></div>
      </div>
      <div class="lbl">${st.type==='in'?'Accredito su':'Addebito su'}</div>
      <div class="seg"><button data-w="conto" class="${st.wallet==='conto'?'on':''}">🏦 Conto</button><button data-w="contanti" class="${st.wallet==='contanti'?'on':''}">💶 Contanti</button></div>
      <div class="lbl">Categoria</div>
      ${catGrid(cats,st.cat)}

      <button class="btn" id="ok">Salva</button>
      ${edit?`<button class="btn ghost" id="pa" style="margin-top:8px">${st.active?'Metti in pausa':'Riattiva'}</button><button class="btn danger" id="del" style="margin-top:8px">Elimina ricorrente</button>`:''}`,sh=>{
      liveAmount($('#am'));
      const keep=()=>{st.name=$('#nm').value.trim();st.amount=parseAmt($('#am').value);st.day=Math.min(31,Math.max(1,parseInt($('#dy').value)||1))};
      sh.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{keep();if(st.type!==b.dataset.t){st.type=b.dataset.t;st.cat=null}draw()});
      sh.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{st.wallet=b.dataset.w;sh.querySelectorAll('[data-w]').forEach(x=>x.classList.toggle('on',x===b))});
      sh.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{st.cat=b.dataset.c;sh.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b))});
      $('#ok').onclick=()=>{
        keep();
        if(!st.name){toast('Dai un nome');return} if(!(st.amount>0)){toast('Inserisci un importo');return} if(!st.cat){toast('Scegli una categoria');return}
        S.recurring=S.recurring||[];
        if(edit){const i=S.recurring.findIndex(x=>x.id===st.id);S.recurring[i]=st}
        else{st.id=uid();st.start=addDays(today(),1);S.recurring.push(st)}
        save();runRecurring();closeSheet();render();toast('Ricorrente salvato ✓');
      };
      if(edit){
        $('#pa').onclick=()=>{st.active=!st.active;const i=S.recurring.findIndex(x=>x.id===st.id);S.recurring[i]={...S.recurring[i],active:st.active};if(st.active)S.recurring[i].start=addDays(today(),1);save();closeSheet();render()};
        $('#del').onclick=()=>{if(!confirm('Eliminare il ricorrente? I movimenti già registrati restano.'))return;S.recurring=S.recurring.filter(x=>x.id!==st.id);save();closeSheet();render();toast('Ricorrente eliminato')};
      }
    });
  }
  draw();
}

    edit&&($('#del').onclick=()=>{
      if(!confirm('Eliminare l\'obiettivo? I soldi segnati come messi da parte torneranno liberi.'))return;
      S.goals=S.goals.filter(x=>x.id!==g.id);S.tx.forEach(t=>{if(t.fund===g.id)delete t.fund});save();closeSheet();render();toast('Obiettivo eliminato')});
  });
}

/* ---------------- CATEGORIE ---------------- */
function catUsed(id){return S.tx.some(t=>t.cat===id)||S.recurring.some(r=>r.cat===id)||S.funds.some(f=>f.cat===id)}
function catsSheet(type){
  const list=S.cats[type];
  openSheet(`<h2>Categorie</h2>
    <div class="seg"><button data-ty="out" class="${type==='out'?'on':''}">Spese</button><button data-ty="in" class="${type==='in'?'on':''}">Entrate</button></div>
    ${list.map(c=>`<button class="row" data-ce="${c.id}" style="${c.hidden?'opacity:.5':''}"><div class="ic">${c.e}</div><div class="rl">${esc(c.name)}${c.hidden?'<small>nascosta</small>':''}</div><div class="rv">›</div></button>`).join('')}
    <button class="btn" id="cNew" style="margin-top:14px">+ Nuova categoria</button>
    <p class="note">Le categorie nascoste non compaiono quando registri un movimento, ma restano nei movimenti già fatti.</p>`,sh=>{
    sh.querySelectorAll('[data-ty]').forEach(b=>b.onclick=()=>catsSheet(b.dataset.ty));
    sh.querySelectorAll('[data-ce]').forEach(b=>b.onclick=()=>catEdit(type,list.find(c=>c.id===b.dataset.ce)));
    $('#cNew').onclick=()=>catEdit(type);
  });
}
function catEdit(type,c){
  const edit=!!c;
  const st=c?{...c}:{id:'c'+uid(),name:'',e:type==='in'?'💶':'📦'};
  const used=edit&&catUsed(c.id);
  openSheet(`<h2>${edit?'Modifica categoria':'Nuova categoria '+(type==='in'?'di entrata':'di spesa')}</h2>
    <div class="two" style="grid-template-columns:80px 1fr">
      <div class="field"><label>Icona</label><input id="ce" value="${esc(st.e)}" maxlength="8" style="text-align:center;font-size:22px;padding:6px"></div>
      <div class="field"><label>Nome</label><input id="cn" value="${esc(st.name)}" maxlength="24" placeholder="Es. Animali, Palestra"></div>
    </div>
    <div class="emos">${EMOJIS.map(e=>`<button data-em="${e}">${e}</button>`).join('')}</div>
    <button class="btn" id="ok">Salva</button>
    ${edit?`<button class="btn ghost" id="hd" style="margin-top:8px">${st.hidden?'Mostra di nuovo':'Nascondi'}</button>
      ${used?'':'<button class="btn danger" id="del" style="margin-top:8px">Elimina</button>'}`:''}
    <button class="btn ghost" id="bk" style="margin-top:8px">‹ Torna alle categorie</button>`,sh=>{
    sh.querySelectorAll('[data-em]').forEach(b=>b.onclick=()=>{$('#ce').value=b.dataset.em});
    const back=()=>catsSheet(type);
    $('#bk').onclick=back;
    $('#ok').onclick=()=>{
      st.name=$('#cn').value.trim(); st.e=$('#ce').value.trim()||'📦';
      if(!st.name){toast('Dai un nome');return}
      if(edit){const k=S.cats[type].findIndex(x=>x.id===st.id);S.cats[type][k]=st}else S.cats[type].push(st);
      save();render();back();toast('Categoria salvata ✓');
    };
    if(edit){
      $('#hd').onclick=()=>{const k=S.cats[type].findIndex(x=>x.id===st.id);S.cats[type][k].hidden=!st.hidden;save();render();back()};
      $('#del')&&($('#del').onclick=()=>{if(!confirm('Eliminare la categoria?'))return;S.cats[type]=S.cats[type].filter(x=>x.id!==st.id);save();render();back()});
    }
  });
}

/* =========================================================
   BACKUP
   ========================================================= */
async function shareOrDownload(name,type,content){
  const blob=new Blob([content],{type});
  try{
    const file=new File([blob],name,{type});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return true}
  }catch(e){if(e&&e.name==='AbortError')return false}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);return true;
}
async function exportBackup(){
  const ok=await shareOrDownload('salvadanaio-backup-'+today()+'.json','application/json',JSON.stringify({app:'salvadanaio',version:DATA_V,exported:new Date().toISOString(),data:S},null,1));
  if(ok){S.lastBackup=today();save();render();toast('Backup creato ✓')}
}
function exportCsv(){
  const rows=[['Data','Tipo','Importo','Portafoglio','Verso','Categoria','Nota','Pagato con soldi da parte']];
  const T={in:'Entrata',out:'Uscita',tr:'Prelevamento',adj:'Rettifica'};
  for(const t of [...S.tx].sort((a,b)=>a.date.localeCompare(b.date))){
    const signed=t.type==='out'?-t.amount:t.amount; const fd=t.fund&&fundById(t.fund);
    rows.push([t.date,t.type==='tr'&&t.wallet==='contanti'?'Versamento':T[t.type],String(signed).replace('.',','),WNAME[t.wallet],t.to?WNAME[t.to]:'',catOf(t.cat).name,t.note||'',fd?fd.name:'']);
  }
  const csv='﻿'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\r\n');
  shareOrDownload('salvadanaio-movimenti-'+today()+'.csv','text/csv',csv);
}
$('#fileIn').onchange=e=>{
  const f=e.target.files[0]; if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{const j=JSON.parse(rd.result);const d=j.data||j;
      if(!d.wallets||!Array.isArray(d.tx))throw 0;
      if(!confirm('Ripristinare il backup? I dati attuali verranno sostituiti.'))return;
      S=migrate(d);save();render();toast('Backup ripristinato ✓');
    }catch(err){toast('File non valido')}
  };
  rd.readAsText(f); e.target.value='';
};

/* =========================================================
   ONBOARDING
   ========================================================= */
function renderOnboarding(){
  $('#app').innerHTML=`<div class="onb">
    <img class="logo" src="logo-white.png" alt="" style="background:#fff">
    <h1>Salvadanaio</h1><p class="sub">Tre dati per iniziare. Potrai cambiarli quando vuoi.</p>
    <div class="card">
      <div class="two">
        <div class="field"><label>🏦 Saldo conto</label><input id="o1" inputmode="decimal" placeholder="0,00"></div>
        <div class="field"><label>💶 Contanti</label><input id="o2" inputmode="decimal" placeholder="0,00"></div>
      </div>
      <div class="field"><label>Stipendio netto mensile</label><input id="o3" inputmode="decimal" placeholder="es. 1.800"><div class="hint">Serve a calcolare il budget prima che arrivi lo stipendio.</div></div>
      <div class="field"><label>Giorno di accredito stipendio</label><input id="o5" type="number" inputmode="numeric" min="1" max="31" placeholder="es. 27 (facoltativo)"><div class="hint">Se lo indichi, lo stipendio verrà registrato da solo ogni mese.</div></div>
      <div class="field"><label>Obiettivo di risparmio mensile</label><input id="o4" inputmode="decimal" placeholder="es. 400"></div>
      <button class="btn" id="go">Inizia</button>
    </div>
    <p class="muted" style="text-align:center;font-size:12px;margin-top:14px">Hai un backup? <a href="#" id="imp" style="color:var(--gold2)">Ripristinalo</a></p>
  </div>`;
  ['#o1','#o2','#o3','#o4'].forEach(id=>liveAmount($(id)));
  $('#imp').onclick=e=>{e.preventDefault();$('#fileIn').click()};
  $('#go').onclick=()=>{
    const v=id=>{const x=parseAmt($(id).value);return isFinite(x)?x:0};
    const sal=v('#o3'), day=parseInt($('#o5').value);
    S=migrate({setup:today(),wallets:{conto:{init:v('#o1')},contanti:{init:v('#o2')}},
      settings:{salary:sal,goal:v('#o4')},goalOv:{},tx:[],recurring:[],lastBackup:null});
    if(sal>0&&day>=1&&day<=31)S.recurring.push({id:uid(),type:'in',name:'Stipendio',amount:sal,wallet:'conto',cat:'stip',day,active:true,start:addDays(today(),1)});
    save();VIEW='home';render();toast('Benvenuto nel tuo Salvadanaio 🐷');
  };
}

/* =========================================================
   INIT
   ========================================================= */
load();
if(S){const before=S.v;S=migrate(S);buildCats();if(before!==DATA_V)save();runRecurring()}
render();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S){const n=S.tx.length;runRecurring();if(S.tx.length!==n)render()}});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
